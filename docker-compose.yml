services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motor_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-motor_monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.api:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-motor_monitoring}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-motor_monitoring}
      DATASET_PATH: /workspace/dataset
      ARTIFACT_DIR: /workspace/artifacts
      REPORT_DIR: /workspace/reports
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./reports:/workspace/reports
      - type: bind
        source: ${DATASET_HOST_PATH:-./Vibration, Acoustic, Temperature, and Motor Current Dataset of Rotating Machine Under Varying Load Conditions for Fault Diagnosis}
        target: /workspace/dataset
        read_only: true
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15

  prediction-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python -m app.mqtt_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-motor_monitoring}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-motor_monitoring}
      ARTIFACT_DIR: /workspace/artifacts
      REPORT_DIR: /workspace/reports
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./reports:/workspace/reports:ro
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  mosquitto_data:
